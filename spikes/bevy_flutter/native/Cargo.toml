[package]
name = "bevy_flutter_spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not part of the repo's root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Same features as benchmarks/compare/bevy so its compiled Bevy is reused.
# bevy_winit is compiled but its plugin is disabled at runtime.
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "scene",
    "std",
    "bevy_winit",
    "multi_threaded",
    "jpeg",
    "png",
    "bevy_sprite",
    "bevy_sprite_render",
] }
wgpu = { version = "29.0.3", default-features = false, features = ["metal"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-io-surface", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3.2", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16


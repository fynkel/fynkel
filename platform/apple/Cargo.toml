[package]
name = "fynkel_platform_apple"
description = "Apple (macOS + iOS) platform interop (blueprint §8.4, ADR-0002 Path A): renders the core's extract into a ring of IOSurface-backed Metal textures that a Flutter Texture presents without a copy. Exports the fynkel_native ABI from the same dylib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Passes `fynkel_native`'s `authoring` feature through: this dylib is the
# one a macOS/iOS app loads, so it decides whether the editor's
# `fynkel_authoring_*` entry points are exported. Same rule as there: on by
# default for the workspace, off in a game's build.
default = ["authoring", "physics", "audio", "animation"]
authoring = ["fynkel_native/authoring"]
# The optional modules (ADR-0029), passed through to `fynkel_native`.
physics = ["fynkel_native/physics"]
audio = ["fynkel_native/audio"]
animation = ["fynkel_native/animation"]

[dependencies]
fynkel_contracts.workspace = true
fynkel_core.workspace = true
fynkel_render.workspace = true
fynkel_native.workspace = true
wgpu.workspace = true
wgpu-hal = { version = "30.0.1", features = ["metal"] }
glam.workspace = true
log.workspace = true
env_logger.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-core-foundation.workspace = true
objc2-io-surface.workspace = true
block2.workspace = true

[dev-dependencies]
fynkel_scene.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fynkel_world = { path = "crates/fynkel_world" }
fynkel_render = { path = "crates/fynkel_render" }
fynkel_present = { path = "crates/fynkel_present" }
fynkel_golden = { path = "crates/fynkel_golden" }
hecs = "0.11.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
png = "0.18.1"
cbindgen = { version = "0.29.4", default-features = false }

# Unsafe code is denied everywhere. `fynkel_ffi` (the C boundary) and the
# platform modules of `fynkel_present` allow it locally, and nothing else.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

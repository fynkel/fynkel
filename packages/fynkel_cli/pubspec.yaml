name: fynkel_cli
description: The fynkel command. Makes a new Fynkel 3D game (fynkel create), and checks that a machine and a game are set up (fynkel doctor).
version: 0.1.0
publish_to: none
homepage: https://fynkel.com
repository: https://github.com/fynkel/fynkel/tree/main/packages/fynkel_cli
issue_tracker: https://github.com/fynkel/fynkel/issues
topics:
  - game
  - game-engine
  - cli

environment:
  sdk: ^3.13.0

executables:
  fynkel:

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0

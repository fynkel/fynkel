# Generates include/fynkel.h from src/abi.rs and src/error.rs. The header is
# checked in; tests/header.rs fails when it is out of date, and
# `FYNKEL_BLESS=1 cargo test -p fynkel_ffi --test header` rewrites it.
language = "C"
include_guard = "FYNKEL_H"
autogen_warning = "/* Generated by cbindgen from crates/fynkel_ffi/src. Do not edit: see tests/header.rs. */"
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["FyStatus"]

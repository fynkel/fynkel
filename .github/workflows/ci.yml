# Runs on every push to main and every pull request.
#
# The runner is self-hosted on the developer's Mac (label `fynkel`,
# ~/actions-runner as a launchd service). It uses the machine's rustup,
# which installs the toolchain pinned in rust-toolchain.toml. `target/` is
# kept between runs for speed; everything else is cleaned, so each run
# starts from the commit alone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: [self-hosted, macOS, fynkel]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      - name: toolchain
        run: rustup show active-toolchain
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # package:fynkel. Its build hook compiles fynkel_ffi; its tests draw
      # the stage 1 scene from Dart to the same golden image. The bindings
      # are generated again from the header and must match the committed
      # ones, so the Dart and C sides can't drift apart.
      - name: dart (package:fynkel)
        working-directory: packages/fynkel
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          dart test
      # package:fynkel_flutter's widget tests (a real engine view behind a
      # stand-in for the Swift plugin), and a macOS build of examples/hello,
      # which compiles the plugin's Swift and bundles the engine.
      - name: flutter (package:fynkel_flutter, examples/hello)
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          cd packages/fynkel_flutter
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          cd ../../examples/hello
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib tool
          flutter analyze --fatal-infos
          flutter build macos --debug
      # The same GPU tests inside the iOS Simulator and the Android
      # emulator: fast testing in simulators is how Flutter developers
      # work, so it must never silently break.
      - name: GPU tests in the iOS Simulator and Android emulator
        run: tools/test-mobile.sh

name: fynkel
description: Code-first 3D games for Flutter, written the way Unity games are, in Dart, on a Rust engine. fynkel_flutter shows them on screen.
version: 0.1.1
homepage: https://fynkel.com
repository: https://github.com/fynkel/fynkel/tree/main/packages/fynkel
issue_tracker: https://github.com/fynkel/fynkel/issues
topics:
  - game
  - game-engine
  - graphics

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  meta: ^1.16.0
  # hook/build.dart builds the engine (crates/fynkel_ffi), or downloads it
  # built, as a code asset; crypto checks the download.
  hooks: ^2.2.0
  code_assets: ^2.2.0
  crypto: ^3.0.6

dev_dependencies:
  ffigen: ^23.0.0
  image: ^4.10.1
  lints: ^6.1.0
  test: ^1.32.0
  vm_service: ^15.0.0

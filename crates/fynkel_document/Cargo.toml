[package]
name = "fynkel_document"
description = "Authoring documents (ADR-0006, ADR-0016): strict JSON reader/writer with spans, document envelope, JSON Schema 2020-12 validation, §14.2 diagnostics. The authoring command service grows here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Checking documents against their JSON Schemas, migration and the text
# diffs (ADR-0041): the tools' side. The runtime a game links reads
# cooked documents the cook already checked and builds without it.
default = ["validate"]
validate = ["dep:jsonschema", "dep:similar"]

[dependencies]
fynkel_contracts.workspace = true
fynkel_core.workspace = true
fynkel_scene.workspace = true
fynkel_physics.workspace = true
fynkel_audio.workspace = true
fynkel_shader.workspace = true
fynkel_cooked.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema = { workspace = true, optional = true }
uuid.workspace = true
similar = { workspace = true, optional = true }
blake3.workspace = true

# `cargo check --target wasm32-unknown-unknown` over the render crate
# (blueprint §12.1, CI): a fresh document id needs a source of randomness
# there, and the browser's is the only one.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# The fixture project instances `rig.glb#prefab` (M3-19a); the integration
# tests validate it with the importer's provider. A dev-dependency cycle
# (fynkel_import depends on this crate) is allowed by cargo and links the
# same lib artifact, so the types agree.
fynkel_import.workspace = true

name: code_only
description: "Fynkel Code Only — a Fynkel game (created by `fynkel create`)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The Fynkel Dart SDK; its native-assets build hook provides the runtime
  # (ADR-0015: built from the checkout, or a prebuilt artifact once published).
  fynkel:
    path: ../../packages/fynkel
  # The Flutter host: the 3D viewport widget and the game loop
  # (FynkelGameView) over the same runtime.
  fynkel_flutter:
    path: ../../packages/fynkel_flutter
  # What lib/editor/ registers with the editor (ADR-0028): only files
  # there import it (FYN-P0015), so the game never ships it.
  fynkel_editor_api:
    path: ../../packages/fynkel_editor_api
  # A Fynkel package (ADR-0029): the gem in the level is its prefab, its
  # Pickup script and its gem kind; its assets show under Packages/pickups.
  pickups:
    path: ../packages/pickups

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # `fynkel codegen --project .` runs this through build_runner: every
  # @FynkelBehaviour class → lib/generated/behaviours.g.dart + schemas/.
  fynkel_generator:
    path: ../../packages/fynkel_generator
  build_runner: ^2.16.0

# The build hook reads the project's `modules` (ADR-0029): this game uses
# no animation, turns the module off and strips it, so the runtime built
# for it carries no animation system.
hooks:
  user_defines:
    fynkel:
      project: .

flutter:
  uses-material-design: true
  # The cooked cache `fynkel cook` stages into fynkel_cache/, bundled so the
  # app runs where it cannot see this directory (an iPhone, a shipped
  # build); lib/main.dart unpacks it when FYNKEL_PROJECT is not on this
  # machine.
  assets:
    - fynkel_cache/

# Runs on every push to main and every pull request.
#
# The runner is self-hosted on the developer's Mac (label `fynkel`,
# ~/actions-runner as a launchd service). It uses the machine's rustup,
# which installs the toolchain pinned in rust-toolchain.toml. `target/` is
# kept between runs for speed; everything else is cleaned, so each run
# starts from the commit alone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: [self-hosted, macOS, fynkel]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      - name: toolchain
        run: rustup show active-toolchain
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # package:fynkel. Its build hook compiles fynkel_ffi; its tests draw
      # the stage 1 scene from Dart to the same golden image. The bindings
      # are generated again from the header and must match the committed
      # ones, so the Dart and C sides can't drift apart. The allocation
      # tests (tagged alloc) run after the rest, one file at a time: they
      # count what the VM allocates, and other files' compiling would
      # slow them.
      - name: dart (package:fynkel)
        working-directory: packages/fynkel
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          dart test -x alloc
          dart test -t alloc --concurrency=1
      # package:fynkel_physics (docs/stage-5.md): its build hook compiles
      # fynkel_physics_ffi, its tests drive Rapier from Dart, and its
      # bindings must match the header as package:fynkel's do. Its example
      # (tumble) is analyzed, run headless (both piles fall and land) and
      # built for macOS, with both libraries.
      - name: dart (package:fynkel_physics)
        working-directory: packages/fynkel_physics
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          (cd example && flutter pub get)
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test tool hook example/lib
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          dart test -x alloc
          dart test -t alloc --concurrency=1
          cd example
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
      # package:fynkel_flutter's widget tests (a real engine view behind a
      # stand-in for the Swift plugin), package:fynkel_measure, the games'
      # and the lab's tests (their real assets, drawn headless, and real
      # physics), and macOS builds of the examples, which compile the
      # plugin's Swift and bundle the engine.
      - name: flutter (package:fynkel_flutter, package:fynkel_measure, examples)
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          cd packages/fynkel_flutter
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          cd ../fynkel_measure
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib bin test
          flutter analyze --fatal-infos
          flutter test
          cd ../../examples/hello
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib
          flutter analyze --fatal-infos
          flutter build macos --debug
          cd ../garden
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../coins
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../arena
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../bowling
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../sheepdog
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../lab
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
          cd ../scale
          flutter pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --debug
      # docs/writing-a-game.md's code, in a throwaway app: it must compile,
      # and its test pass, so the guide never drifts from the API.
      - name: the guide
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          python3 tools/check_guide.py
      # Long runs (stage 6, PR 13), a few minutes together:
      # - the present thread's stress test for a million frames;
      # - the loaders given damaged copies of every sample, built for
      #   release, as many copies as there are (tests/damaged.rs);
      # - Miri on the unsafe code it can run: the C boundary's guard, the
      #   present stress test (a few hundred frames), and the physics C
      #   layer's quick tests, on x86_64 as Miri can't run Rapier's ARM
      #   vector code (all of them pass too, but take 33 minutes);
      # - the lab's every scene for 40 rounds in one world each, the
      #   memory flat (examples/lab/test/soak_test.dart).
      - name: long runs
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          FYNKEL_STRESS_FRAMES=1000000 cargo test -p fynkel_present --test stress
          FYNKEL_FUZZ_ITERS=1000 cargo test --release -p fynkel_load --test damaged
          export MIRIFLAGS=-Zmiri-disable-isolation
          cargo +nightly miri test -p fynkel_cabi
          cargo +nightly miri test -p fynkel_present --test stress
          cargo +nightly miri test -p fynkel_physics_ffi --target x86_64-unknown-linux-gnu --test abi -- null_pointers reading_the_moves a_step_is_as_long removed_and_unknown
          cd examples/lab
          FYNKEL_SOAK_ROUNDS=40 flutter test --enable-vmservice test/soak_test.dart
      # The same GPU tests inside the iOS Simulator and the Android
      # emulator: fast testing in simulators is how Flutter developers
      # work, so it must never silently break.
      - name: GPU tests in the iOS Simulator and Android emulator
        run: tools/test-mobile.sh

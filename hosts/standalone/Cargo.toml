[package]
name = "fynkel_host_standalone"
description = "Standalone winit/wgpu host: owns the loop, steps fynkel_core, renders its extract. The M0 baseline ruler for host/composition overhead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fynkel_core.workspace = true
# The `device` feature: `--audio` opens the output device (M3-11).
fynkel_audio = { workspace = true, features = ["device"] }
fynkel_assets.workspace = true
fynkel_contracts.workspace = true
fynkel_document.workspace = true
fynkel_render.workspace = true
fynkel_host_headless.workspace = true
wgpu.workspace = true
winit.workspace = true
glam.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true

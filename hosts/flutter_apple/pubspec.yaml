name: fynkel_host_flutter
description: "Fynkel Flutter macOS/iOS host: the measurement harness as a thin app on package:fynkel_flutter (viewport + loop) and package:fynkel (gameplay)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  fynkel:
    path: ../../packages/fynkel
  fynkel_flutter:
    path: ../../packages/fynkel_flutter
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

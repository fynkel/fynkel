[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fynkel_world = { path = "crates/fynkel_world" }
fynkel_render = { path = "crates/fynkel_render" }
fynkel_present = { path = "crates/fynkel_present" }

# Unsafe code is denied everywhere. `fynkel_ffi` (the C boundary) and the
# platform modules of `fynkel_present` allow it locally, and nothing else.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

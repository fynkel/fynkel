name: fynkel_physics
description: 3D physics for Fynkel games, on Rapier. Rigidbodies, colliders, triggers, joints and a character controller, as in Unity.
version: 0.1.0
publish_to: none
homepage: https://fynkel.com
repository: https://github.com/fynkel/fynkel/tree/main/packages/fynkel_physics
issue_tracker: https://github.com/fynkel/fynkel/issues
topics:
  - game
  - game-engine
  - physics

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  meta: ^1.16.0
  fynkel:
    path: ../fynkel
  # hook/build.dart builds crates/fynkel_physics_ffi as a code asset.
  hooks: ^2.2.0
  code_assets: ^2.1.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.32.0
  vm_service: ^15.0.0

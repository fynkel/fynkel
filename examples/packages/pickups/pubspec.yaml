name: pickups
description: "Pickups — an example Fynkel package (ADR-0029): a Pickup script, a PickupKind data type, a pickup prefab and its material, and an editor part. examples/code_only depends on it."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The engine the scripts are written against.
  fynkel:
    path: ../../../packages/fynkel
  # What lib/editor/ registers with the editor (ADR-0028): only files
  # there import it (FYN-P0015), so a game using the package never ships it.
  fynkel_editor_api:
    path: ../../../packages/fynkel_editor_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # `fynkel codegen --project .` in this folder: lib/generated/ + schemas/.
  fynkel_generator:
    path: ../../../packages/fynkel_generator
  build_runner: ^2.16.0

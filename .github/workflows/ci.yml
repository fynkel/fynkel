# The check on a pull request, kept short: about ten minutes, and about one
# when only text changed (docs, the website, READMEs). What takes long and
# seldom breaks runs each night instead, in nightly.yml: long runs, the
# simulators, every example's app, the phone builds.
#
# It doesn't run again on main after a merge: that tree was just tested as
# the pull request's merge, and nightly.yml tests main itself.
#
# The runner is self-hosted on the developer's Mac (label `fynkel`,
# ~/actions-runner as a launchd service). It uses the machine's rustup,
# which installs the toolchain pinned in rust-toolchain.toml. `target/` is
# kept between runs for speed; everything else is cleaned, so each run
# starts from the commit alone.
#
# The repository variable RUNNER moves every job to GitHub's own Macs,
# without touching this file:  gh variable set RUNNER -b '["macos-26"]'
# It is set before the repository is public, and the Mac's runner removed:
# a pull request from anyone runs its own code here.
name: ci

on:
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ${{ fromJSON(vars.RUNNER || '["self-hosted","macOS","fynkel"]') }}
    timeout-minutes: 60
    steps:
      # Two commits deep: a pull request's is its merge, whose first parent
      # is the base it's compared with below.
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 2
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      # Text alone can't break the engine's tests: only the guide's code
      # is checked then. Anything unsure (a run by hand, a diff that
      # fails) counts as code.
      - name: what changed
        id: changed
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
            if ! grep -qvE '^(docs|website)/|\.md$|^LICENSE$' <<<"$files"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/hosted
      - name: toolchain
        if: steps.changed.outputs.code == 'true'
        run: rustup show active-toolchain
      - name: fmt
        if: steps.changed.outputs.code == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        run: cargo test --workspace --no-fail-fast
      # The benchmarks (stage 14's GT1, crates/fynkel_bench): each times
      # one thing the frame path does, in release, and fails when its
      # median is over its bar (the Mac's time when it was set, doubled),
      # so a slowdown shows on the PR that makes it.
      #
      # They, and the Dart side's timed tests (tagged timing), are run
      # once more when they fail, and when that fails too they say so, on
      # the run's page, without failing the run: on this one Mac a busy
      # moment (other work, a build) has put a 0.5 ms median at 5 ms and
      # held whole PRs for hours. The warning is the cue to look. Not on
      # GitHub's Macs: too slow and too shared to say anything, and 25
      # minutes of building. Run them by hand before a release.
      - name: timing bars
        if: "!cancelled() && steps.changed.outputs.code == 'true' && runner.environment != 'github-hosted'"
        continue-on-error: true
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          bars() {
            cargo test --release -p fynkel_mesh -p fynkel_world -p fynkel_physics -p fynkel_render -p fynkel_ffi -- --ignored bench_ &&
              (cd examples/scale && flutter pub get >/dev/null && flutter test -t timing)
          }
          bars || bars || {
            echo "::warning title=Timing bars::over their bars twice: see this step's log"
            exit 1
          }
      # package:fynkel. Its build hook compiles fynkel_ffi; its tests draw
      # the stage 1 scene from Dart to the same golden image. The bindings
      # are generated again from the header and must match the committed
      # ones, so the Dart and C sides can't drift apart. The allocation
      # tests (tagged alloc) run after the rest, one file at a time: they
      # count what the VM allocates, and other files' compiling would
      # slow them.
      - name: dart (package:fynkel)
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        working-directory: packages/fynkel
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          failed=
          dart test -x alloc || failed=1
          dart test -t alloc --concurrency=1 || failed=1
          [ -z "$failed" ]
      # package:fynkel_physics (docs/stage-5.md): its build hook compiles
      # fynkel_physics_ffi, its tests drive Rapier from Dart, and its
      # bindings must match the header as package:fynkel's do. Its example
      # (tumble) is analyzed, run headless (both piles fall and land) and
      # built for macOS at night
      # (nightly.yml).
      - name: dart (package:fynkel_physics)
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        working-directory: packages/fynkel_physics
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          (cd example && flutter pub get)
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test tool hook example/lib example/tool
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          failed=
          dart test -x alloc || failed=1
          dart test -t alloc --concurrency=1 || failed=1
          [ -z "$failed" ]
          cd example
          flutter analyze --fatal-infos
          flutter test
      # package:fynkel_audio (docs/stage-11.md): its build hook compiles
      # fynkel_audio_ffi, its tests play and time sound from Dart without a
      # device (none opens unless a world is on screen), its frames make no
      # garbage, and its bindings must match the header as package:fynkel's
      # do.
      - name: dart (package:fynkel_audio)
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        working-directory: packages/fynkel_audio
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed lib test tool hook
          dart analyze --fatal-infos
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.g.dart
          failed=
          dart test -x alloc || failed=1
          dart test -t alloc --concurrency=1 || failed=1
          [ -z "$failed" ]
      # package:fynkel_flutter's widget tests (a real engine view behind a
      # stand-in for the Swift plugin), package:fynkel_measure, the games'
      # and the lab's tests (their real assets, drawn headless, and real
      # physics), and the lab built for macOS, which compiles the plugin's
      # Swift and bundles all three packages. The others' builds are in
      # nightly.yml.
      - name: flutter (package:fynkel_flutter, package:fynkel_measure, examples)
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          failed=
          for app in packages/fynkel_flutter packages/fynkel_measure examples/*/; do
            echo "== $app"
            set +e
            (
              set -e
              cd "$app"
              flutter pub get
              dirs=
              for d in lib bin test tool; do [ -d $d ] && dirs="$dirs $d"; done
              dart format -l 120 --output=none --set-exit-if-changed $dirs
              flutter analyze --fatal-infos
              case "$app" in
                # Its timed tests are in the timing bars, above.
                examples/scale/) flutter test -x timing ;;
                *) flutter test ;;
              esac
            )
            [ $? = 0 ] || failed="$failed $app"
            set -e
          done
          (cd examples/lab && flutter build macos --debug)
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
      # package:fynkel_cli, the fynkel command: one of its tests makes a
      # real game on this clone, analyzes it and runs its test.
      - name: dart (package:fynkel_cli)
        if: "!cancelled() && steps.changed.outputs.code == 'true'"
        working-directory: packages/fynkel_cli
        run: |
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          dart pub get
          dart format -l 120 --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      # the website's documentation's code, in a throwaway app: it must compile,
      # and its test pass, so the guide never drifts from the API. The
      # reference test reads the guide too, and is in `test` otherwise.
      - name: the guide
        if: "!cancelled()"
        run: |
          if [ "${{ steps.changed.outputs.code }}" != true ]; then cargo test -p fynkel_render --test reference; fi
          export PATH="$HOME/Documents/flutter/flutter/bin:$PATH"
          python3 tools/check_guide.py

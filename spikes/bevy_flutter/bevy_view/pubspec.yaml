name: bevy_view
description: Spike - presents a Bevy IOSurface ring through a Flutter Texture (macOS + iOS).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BevyViewPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BevyViewPlugin
        sharedDarwinSource: true

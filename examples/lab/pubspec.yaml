name: lab
description: "The feature lab: one scene for each feature of Fynkel, to try it by hand."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  fynkel:
    path: ../../packages/fynkel
  fynkel_flutter:
    path: ../../packages/fynkel_flutter
  fynkel_physics:
    path: ../../packages/fynkel_physics
  fynkel_audio:
    path: ../../packages/fynkel_audio

dev_dependencies:
  fynkel_measure:
    path: ../../packages/fynkel_measure
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  ffi: ^2.2.0
  lints: ^6.1.0
  vm_service: ^15.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/kaykit/
    - assets/shaders/
    - assets/music/
    - assets/fonts/

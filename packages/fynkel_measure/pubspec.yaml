name: fynkel_measure
description: Measures a Fynkel app as the stage reports do. The stats line and memory marks inside the app, and the tool that runs it and reads them (bin/measure.dart).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  fynkel_flutter:
    path: ../fynkel_flutter

dev_dependencies:
  lints: ^6.1.0

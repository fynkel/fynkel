name: fynkel_authoring
description: "Fynkel Engine - the editor's Dart surface over the authoring ABI (crates/fynkel_authoring through fynkel_native's `authoring` feature). Games never depend on it."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  # The native runtime reaches this package as package:fynkel's code asset
  # (`package:fynkel/fynkel_native`, ADR-0015); the user-define below makes
  # its build hook compile the runtime WITH the authoring ABI. Nothing else
  # of package:fynkel is imported here (the editor never runs game code,
  # ADR-0016).
  fynkel:
    path: ../fynkel

dev_dependencies:
  ffigen: ^20.0.0
  test: ^1.25.0
  lints: ^6.0.0

# The cargo feature `authoring` puts the fynkel_authoring_* entry points into
# the runtime this package (and the editor app that depends on it) loads. A
# game's pubspec never lists it, so its runtime carries no editor code
# (blueprint §19.2e item 1, §1.1 rule 6).
hooks:
  user_defines:
    fynkel:
      features: [authoring]

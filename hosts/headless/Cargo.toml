[package]
name = "fynkel_host_headless"
description = "Rust headless host (blueprint §5.2): drives fynkel_core with a deterministic scripted scene, no renderer. Library for `fynkel test --headless` and the standalone host's demo scene; binary for scripted runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fynkel_host_headless"
path = "src/main.rs"

[dependencies]
fynkel_contracts.workspace = true
fynkel_core.workspace = true
fynkel_scene.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

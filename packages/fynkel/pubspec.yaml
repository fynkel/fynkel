name: fynkel
description: "Fynkel Engine - Flutter-independent Dart gameplay API over the native runtime (ABI v5), with the native-assets build hook that provides the runtime (ADR-0015)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  # Build hook (hook/build.dart): provides the native runtime as a code asset.
  hooks: ^2.0.2
  code_assets: ^1.2.1
  crypto: ^3.0.6

dev_dependencies:
  ffigen: ^20.0.0
  vm_service: ^15.0.0 # tool/alloc_bench.dart
  test: ^1.25.0
  lints: ^6.0.0

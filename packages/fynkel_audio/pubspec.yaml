name: fynkel_audio
description: Sound for Fynkel, as Unity has it. Add it to a game that needs it; a game without it ships none of it.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  meta: ^1.16.0
  fynkel:
    path: ../fynkel
  # hook/build.dart builds crates/fynkel_audio_ffi as a code asset.
  hooks: ^2.2.0
  code_assets: ^2.1.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.32.0
  vm_service: ^15.0.0

[package]
name = "fynkel_authoring"
description = "The editor's session layer over fynkel_document (ADR-0016, blueprint §19.2e item 1): one open project — schemas, lock, asset database, behaviour metadata — and one authoring Editor per open document, addressed by handle, with every read as JSON. Editor-only: never linked into a game build (fynkel_native links it behind the `authoring` feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fynkel_contracts.workspace = true
fynkel_document = { workspace = true, features = ["validate"] }
# The `shaders` query and the live edit of a shader asset's material
# (ADR-0031).
fynkel_shader.workspace = true
# `expected_lock()` for the lock check and the imported-prefab provider
# for project validation. Development-only code, like this crate.
fynkel_import.workspace = true
# `Default` of every authored component, for the `defaults` query (what an
# entity created "with a native component" starts with).
fynkel_core = { workspace = true, features = ["default"] }
fynkel_physics.workspace = true
fynkel_scene.workspace = true
fynkel_audio.workspace = true
# The edit-preview world (M4-06): the cooked cache the Scene view draws
# from, its mesh payloads for picking and outlines.
fynkel_assets.workspace = true
glam.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# `tests/preview.rs` renders the edit-preview world and a plain game world
# of the same scene headlessly and compares the pixels.
fynkel_render.workspace = true
wgpu.workspace = true


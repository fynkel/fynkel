[package]
name = "fynkel_document"
description = "Authoring documents (ADR-0006, ADR-0016): strict JSON reader/writer with spans, document envelope, JSON Schema 2020-12 validation, §14.2 diagnostics. The authoring command service grows here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fynkel_contracts.workspace = true
fynkel_core.workspace = true
fynkel_scene.workspace = true
fynkel_physics.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
uuid.workspace = true
similar.workspace = true
blake3.workspace = true

[dev-dependencies]
# The fixture project instances `rig.glb#prefab` (M3-19a); the integration
# tests validate it with the importer's provider. A dev-dependency cycle
# (fynkel_import depends on this crate) is allowed by cargo and links the
# same lib artifact, so the types agree.
fynkel_import.workspace = true

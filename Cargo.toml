[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fynkel_cabi = { path = "crates/fynkel_cabi" }
fynkel_world = { path = "crates/fynkel_world" }
fynkel_render = { path = "crates/fynkel_render" }
fynkel_present = { path = "crates/fynkel_present" }
fynkel_golden = { path = "crates/fynkel_golden" }
fynkel_mesh = { path = "crates/fynkel_mesh" }
fynkel_load = { path = "crates/fynkel_load" }
fynkel_physics = { path = "crates/fynkel_physics" }
fynkel_physics_ffi = { path = "crates/fynkel_physics_ffi" }
fynkel_audio = { path = "crates/fynkel_audio" }
fynkel_audio_ffi = { path = "crates/fynkel_audio_ffi" }
hecs = "0.11.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
wgpu = "30.0.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
png = "0.18.1"
# PNG and JPEG only, and no thread pool: decoding runs on the caller's thread.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
# .glb parsing only: images go through fynkel_load's own decoding, and
# nothing is read from files.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_texture_transform", "KHR_materials_emissive_strength", "extensions"] }
jni-sys = "0.3.1"
bevy_mikktspace = { version = "1.0.0", default-features = false, features = ["std"] }
# Physics (packages/fynkel_physics): single-threaded, 32-bit floats.
rapier3d = "0.36.1"
cbindgen = { version = "0.29.4", default-features = false }
# Sound (packages/fynkel_audio): the output device (CoreAudio, AAudio), a
# lock-free ring each way between the game and the audio thread, and
# decoding. Only what games load: WAV, OGG Vorbis and MP3.
cpal = "0.18.2"
rtrb = "0.4.0"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

# The build hook (package:fynkel/hooks.dart) always builds in release, so
# this is what every app ships. Measured on the Mac (stage 6, PR 12b):
# the engine library 7.2 → 5.0 MB and physics 3.3 → 2.4 MB; a clean build
# 31 → 49 s, a rebuild after an edit 3 → 5 s. Thin LTO shrank nothing more
# than strip alone.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Unsafe code is denied everywhere. `fynkel_ffi` (the C boundary) and the
# platform modules of `fynkel_present` allow it locally, and nothing else.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
resolver = "2"
members = [
    "crates/fynkel_contracts",
    "crates/fynkel_schema_derive",
    "crates/fynkel_ecs",
    "crates/fynkel_scene",
    "crates/fynkel_physics",
    "crates/fynkel_audio",
    "crates/fynkel_animation",
    "crates/fynkel_core",
    "crates/fynkel_wire",
    "crates/fynkel_render",
    "crates/fynkel_shader",
    "crates/fynkel_native",
    "crates/fynkel_document",
    "crates/fynkel_import",
    "crates/fynkel_cooked",
    "crates/fynkel_assets",
    "crates/fynkel_authoring",
    "crates/fynkel_preview",
    "platform/apple",
    "hosts/headless",
    "hosts/standalone",
    "apps/cli",
    "examples/native_combat",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "UNLICENSED"   # see docs/decisions/ADR-0005 (open until the M3 public push)

[workspace.dependencies]
wgpu = "30.0.1"
# ADR-0061: the renderer's fallback ASTC decoder (pure Rust) and the cook's encoder.
astc-decode = "0.3.1"
ctt-astcenc = { version = "0.6", features = ["rayon"] }
winit = "0.30.13"
glam = { version = "0.33.7", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
log = "0.4.34"
env_logger = "0.11.11"
hecs = "0.11.1"
rapier3d = "0.35.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.56", default-features = false }
uuid = { version = "1.26", features = ["v4", "v5"] }
similar = "2"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength"] }
base64 = "0.23"
ufbx = "0.11.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "ogg", "vorbis"] }
cpal = "0.18.2"
rtrb = "0.4.0"
blake3 = "1"
crc32fast = "1"
fynkel_contracts = { path = "crates/fynkel_contracts" }
fynkel_cooked = { path = "crates/fynkel_cooked" }
fynkel_schema_derive = { path = "crates/fynkel_schema_derive" }
fynkel_ecs = { path = "crates/fynkel_ecs" }
fynkel_scene = { path = "crates/fynkel_scene" }
fynkel_physics = { path = "crates/fynkel_physics", default-features = false }
fynkel_audio = { path = "crates/fynkel_audio", default-features = false }
fynkel_animation = { path = "crates/fynkel_animation" }
fynkel_core = { path = "crates/fynkel_core", default-features = false }
fynkel_wire = { path = "crates/fynkel_wire" }
fynkel_render = { path = "crates/fynkel_render" }
fynkel_shader = { path = "crates/fynkel_shader" }
fynkel_native = { path = "crates/fynkel_native", default-features = false }   # `authoring` is opted into per dependent (platform/apple passes it through)
fynkel_document = { path = "crates/fynkel_document", default-features = false }
fynkel_import = { path = "crates/fynkel_import" }
fynkel_assets = { path = "crates/fynkel_assets" }
fynkel_preview = { path = "crates/fynkel_preview" }
fynkel_authoring = { path = "crates/fynkel_authoring" }
fynkel_host_headless = { path = "hosts/headless" }

[profile.release]
debug = 1   # keep symbols for profiling M0 baselines

# The ASTC encoder (ADR-0061) is C++ built by `cc` at the package's
# opt-level: unoptimised, a debug cook spends ~8 s per megapixel instead of
# ~0.1 s.
[profile.dev.package.ctt-astcenc]
opt-level = 3

[workspace.dependencies.objc2]
version = "0.6.3"
[workspace.dependencies.objc2-foundation]
version = "0.3.2"
[workspace.dependencies.objc2-metal]
version = "0.3.2"
features = ["objc2-io-surface", "block2"]
[workspace.dependencies.block2]
version = "0.6.2"
[workspace.dependencies.objc2-core-foundation]
version = "0.3.2"
[workspace.dependencies.objc2-io-surface]
version = "0.3.2"

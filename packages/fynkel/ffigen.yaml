# Generates lib/src/native/fynkel_bindings.g.dart from the hand-written C
# header (ADR-0004). Run from packages/fynkel:  dart run ffigen
name: FynkelNativeBindings
description: Generated dart:ffi bindings for crates/fynkel_native/include/fynkel.h (ABI v1). Do not edit.
output: lib/src/native/fynkel_bindings.g.dart
headers:
  entry-points:
    - ../../crates/fynkel_native/include/fynkel.h
  include-directives:
    - '**fynkel.h'
# M0: classic DynamicLibrary lookup. The native-assets hook (ADR-0015)
# switches this to `ffi-native` with an asset id in M1.
preamble: |
  // GENERATED by ffigen from crates/fynkel_native/include/fynkel.h — do not edit.
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
silence-enum-warning: true

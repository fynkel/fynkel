# ADR-0012 pipeline (b): applied to every package that depends on
# fynkel_generator. One aggregate step per package writes
# lib/generated/behaviours.g.dart and lib/generated/behaviours.g.json into
# the source tree (they are committed); `fynkel codegen` drives it.
builders:
  behaviours:
    import: "package:fynkel_generator/fynkel_generator.dart"
    builder_factories: ["behaviourBuilder"]
    build_extensions:
      "$lib$":
        - "generated/behaviours.g.dart"
        - "generated/behaviours.g.json"
    auto_apply: dependents
    build_to: source
    runs_before: []

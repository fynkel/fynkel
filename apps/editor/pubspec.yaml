name: fynkel_editor
description: "The Fynkel Editor (M4): a Flutter macOS desktop app over the authoring session."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The editor's Dart surface over the authoring ABI (M4-01). Through
  # package:fynkel's build hook it loads the runtime WITH the `authoring`
  # feature (the user-define below); a game never lists that feature.
  fynkel_authoring:
    path: ../../packages/fynkel_authoring
  # The Scene view's `FynkelViewport` (item 6): the same texture widget a
  # game host uses, here over the edit-preview world (viewport ABI v4).
  fynkel_flutter:
    path: ../../packages/fynkel_flutter
  # The docking workspace (blueprint §19.2e item 2; ADR-0016 resolutions record the spike).
  docking: ^1.16.2
  # The launcher's directory chooser (Open project, New project's parent directory).
  file_picker: ^10.3.10
  # Project directory changes → rescan + revalidate (the Console stays current).
  watcher: ^1.2.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The Scene view's debounced state save under a fake clock.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

hooks:
  user_defines:
    fynkel:
      features: [authoring]

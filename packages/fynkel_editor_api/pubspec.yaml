name: fynkel_editor_api
description: "Fynkel Engine - what a package's editor part (lib/editor/editor.dart, ADR-0028) registers with the editor: menu items first. Interfaces and widgets only, no platform plugins; the editor (package:fynkel_editor) implements it."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

formatter:
  page_width: 120

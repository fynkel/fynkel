name: fynkel
description: Fynkel's Dart API, over the native engine through dart:ffi. Pure Dart; package:fynkel_flutter shows it on screen.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  meta: ^1.16.0
  # hook/build.dart builds the engine (crates/fynkel_ffi), or downloads it
  # built, as a code asset; crypto checks the download.
  hooks: ^2.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6

dev_dependencies:
  ffigen: ^23.0.0
  image: ^4.10.1
  lints: ^6.1.0
  test: ^1.32.0
  vm_service: ^15.0.0

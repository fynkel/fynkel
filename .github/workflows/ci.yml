# The same gate `docs/status.md` describes, run on every push and pull
# request so "green" is a machine's word, not a person's. Keep the step list
# in sync with the "Verification" section of docs/status.md.
#
# The jobs run on a self-hosted runner on the developer's Mac (label
# `fynkel`; ~/actions-runner, a launchd service), since GitHub-hosted
# minutes are unavailable on this account. The runner uses the machine's
# own rustup and Flutter (checked against FLUTTER_VERSION below), and it
# keeps `target/` between runs: the checkout does not clean, a step
# cleans everything else, so each run still starts from the commit alone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FLUTTER_VERSION: 3.47.2

jobs:
  rust:
    name: rust (fmt, clippy, test, codegen --check)
    # Apple crates (platform/apple, hosts/flutter_apple) need a macOS toolchain.
    runs-on: [self-hosted, macOS, fynkel]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      # rust-toolchain.toml pins the channel and the Apple targets; rustup
      # installs them on first use.
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # A runtime built with `modules.strip` (ADR-0029): the physics
      # stand-in keeps the adapter's contract, and a world without the
      # modules refuses their commands (foundation 6.5).
      - name: test a stripped runtime
        run: |
          cargo test -p fynkel_physics --no-default-features
          cargo test -p fynkel_core --no-default-features --test modules
      # A game's runtime reads documents the cook already checked
      # (ADR-0041): no JSON Schema or text diffs in it, and
      # fynkel_document still builds without its `validate` feature.
      - name: no document validation in a game runtime
        run: |
          ./tools/check_runtime_deps.sh
          cargo clippy -p fynkel_document --no-default-features -- -D warnings
      - name: codegen --check
        run: cargo run -p fynkel_cli -- codegen --check
      - name: foundation qualification runner regression tests
        run: python3 -m unittest discover -s tools/tests
      - name: foundation native scale regression gate
        run: python3 tools/foundation_release.py --suite native-scale --baseline benchmarks/foundation/budgets/mac-m3max-native.json
      - name: preserve foundation qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-native-scale
          path: target/foundation-release/
      # A game's runtime carries no editor code (blueprint §19.2e item 1):
      # built without the `authoring` feature — what package:fynkel's hook
      # does for an app that does not ask for it — the dylibs export no
      # `fynkel_authoring_*` symbol, and the workspace build exports them.
      - name: no editor code in a game runtime
        run: |
          cargo build -p fynkel_native -p fynkel_platform_apple --no-default-features
          for lib in target/debug/libfynkel_native.dylib target/debug/libfynkel_platform_apple.dylib; do
            if nm -gU "$lib" | grep -q fynkel_authoring_; then echo "$lib exports the authoring ABI"; exit 1; fi
            nm -gU "$lib" | grep -q _fynkel_world_step
          done
          cargo build -p fynkel_native -p fynkel_platform_apple
          nm -gU target/debug/libfynkel_platform_apple.dylib | grep -q _fynkel_authoring_apply

  # Blueprint §12.1: the engine's portable crates still compile for the
  # browser. A compile check, not a product — no wasm runtime is built or
  # run. Kept green while it costs nothing to keep green.
  wasm:
    name: wasm32 check (core, scene, physics, render)
    runs-on: [self-hosted, macOS, fynkel]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      - name: Rust toolchain
        run: rustup show active-toolchain && rustup target add wasm32-unknown-unknown
      - name: cargo check --target wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown -p fynkel_core -p fynkel_scene -p fynkel_physics -p fynkel_render

  dart:
    name: dart (package:fynkel, fynkel_authoring, fynkel_flutter, fynkel_generator, example, starter project and showcase)
    runs-on: [self-hosted, macOS, fynkel]
    # Every Dart test that cooks uses this build's CLI, never a `fynkel`
    # installed on the machine (a stale one cooks for another schema
    # fingerprint: FYN-R0002).
    env:
      FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: clean (all but target/)
        run: git clean -ffdx -e /target/ && git reset --hard HEAD
      - name: Rust toolchain
        run: rustup show active-toolchain
      # Flutter's Dart is the toolchain of record (docs/toolchain.md).
      # Flutter's bin goes first on PATH: a Homebrew `dart` would shadow it.
      - name: Flutter
        run: |
          flutter --version | tee /dev/stderr | grep -q "Flutter $FLUTTER_VERSION "
          dirname "$(command -v flutter)" >> "$GITHUB_PATH"
      - name: build the CLI
        run: cargo build -p fynkel_cli
      - name: pub get
        working-directory: packages/fynkel
        run: dart pub get
      - name: analyze
        working-directory: packages/fynkel
        run: dart analyze --fatal-infos
      # The native-assets hook builds the runtime (cargo, release) for the
      # host architecture before the tests run.
      - name: test
        working-directory: packages/fynkel
        run: dart test
      # The editor's Dart surface over the authoring ABI (M4-01): its pubspec
      # opts into the `authoring` cargo feature, so the hook builds the
      # runtime once more with the fynkel_authoring_* entry points, and the
      # test drives a complete edit session on a copy of the fixture project.
      - name: fynkel_authoring pub get + analyze + test
        working-directory: packages/fynkel_authoring
        run: dart pub get && dart analyze --fatal-infos && dart test
      # The Flutter host package (M3-01): viewport controller + game view
      # against the real Rust viewport (headless Metal) and a mocked
      # texture channel.
      - name: fynkel_flutter pub get + analyze + test
        working-directory: packages/fynkel_flutter
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The editor API a package's editor part is written against (ADR-0028).
      - name: fynkel_editor_api pub get + analyze + test
        working-directory: packages/fynkel_editor_api
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The measurement host is a thin app on the package; it must still
      # analyze (its macOS build is exercised by the benchmark capture, not CI).
      - name: hosts/flutter_apple pub get + analyze
        working-directory: hosts/flutter_apple
        run: flutter pub get && flutter analyze --fatal-infos
      # The behaviour generator (ADR-0012 pipeline (b)) and its example
      # package, which is the M2-16 gate: authored scene data → compiled
      # Dart behaviour.
      - name: generator pub get + analyze + test
        working-directory: packages/fynkel_generator
        # The example is analyzed with the generator: resolve it first.
        run: (cd example/spinner_game && dart pub get) && dart pub get && dart analyze --fatal-infos && dart test
      - name: example pub get + analyze + test
        working-directory: packages/fynkel_generator/example/spinner_game
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: codegen --check --project
        run: cargo run -p fynkel_cli -- codegen --check --project packages/fynkel_generator/example/spinner_game
      # The M2-17 gate: a fresh `fynkel create` project (with its Flutter
      # runners) validates, runs on the headless host, analyzes and passes
      # its own `flutter test`.
      - name: fynkel create
        run: cargo run -p fynkel_cli -- create ${{ runner.temp }}/starter_game
      - name: starter validate + headless
        working-directory: ${{ runner.temp }}/starter_game
        run: |
          "$GITHUB_WORKSPACE/target/debug/fynkel" validate --root "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless --root "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless --input test/walk.input.json --root "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/target/debug/fynkel" codegen --check --project . --root "$GITHUB_WORKSPACE"
      # The starter's test cooks the project first (package:fynkel/testing.dart);
      # FYNKEL_CLI points it at the built CLI instead of a `cargo run`.
      - name: starter flutter analyze + test
        working-directory: ${{ runner.temp }}/starter_game
        env:
          FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
        run: flutter pub get && flutter analyze && flutter test
      # The renderer's example scene (examples/showcase, M3-05a): validates,
      # runs headless, renders from its cache (the macOS runner has a GPU;
      # exit 2 = no adapter would fail this step) and passes its own test.
      - name: showcase validate + headless + render + codegen
        working-directory: examples/showcase
        run: |
          cmp assets/models/character.glb ../reference_game/assets/models/character.glb   # the runner is the reference game's character (tools/character.py)
          python3 tools/sky.py && git diff --exit-code -- assets/textures/sky.hdr            # the HDR environment is generated (E1)
          "$GITHUB_WORKSPACE/target/debug/fynkel" validate
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless
          "$GITHUB_WORKSPACE/target/debug/fynkel" render --out "${{ runner.temp }}/showcase.png" --steps 10
          "$GITHUB_WORKSPACE/target/debug/fynkel" codegen --check --project .
      - name: showcase flutter analyze + test
        working-directory: examples/showcase
        env:
          FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The reference game (examples/reference_game, M3-14/15): the three
      # scenes are generated by its tools (checked in; regenerated here to
      # catch drift), validate, run headless (the Menu — the startup scene
      # —, the Results with its jingle, the Playground replaying the
      # collect-all recording on the Rust host), render, and its Dart
      # gameplay test walks Menu → Playground → Results and collects all
      # ten coins from the same recording.
      - name: reference game generate + validate + headless + render + codegen
        working-directory: examples/reference_game
        run: |
          python3 tools/kit.py && python3 tools/character.py && python3 tools/playground.py && python3 tools/route.py
          git diff --exit-code -- assets test/collect_all.input.json
          "$GITHUB_WORKSPACE/target/debug/fynkel" validate
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless --scene assets/scenes/results.scene.json --steps 200
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless --scene assets/scenes/playground.scene.json --input test/collect_all.input.json --steps 1400
          "$GITHUB_WORKSPACE/target/debug/fynkel" render --scene assets/scenes/playground.scene.json --out "${{ runner.temp }}/reference_game.png" --steps 40
          "$GITHUB_WORKSPACE/target/debug/fynkel" codegen --check --project .
      - name: reference game flutter analyze + test
        working-directory: examples/reference_game
        env:
          FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The code-only game (examples/code_only, ADR-0026 §8): no startup
      # scene; its documents are written from Dart specs by tool/scenes.dart
      # (game_test.dart checks they are current), and the Dart test plays it
      # both ways — built live and from the written scenes.
      - name: code-only game validate + headless + codegen
        working-directory: examples/code_only
        # pub get first: the pickups package's assets are found through the
        # package graph (ADR-0029).
        run: |
          flutter pub get
          "$GITHUB_WORKSPACE/target/debug/fynkel" validate
          "$GITHUB_WORKSPACE/target/debug/fynkel" test --headless --scene assets/scenes/level.scene.json
          "$GITHUB_WORKSPACE/target/debug/fynkel" codegen --check --project .
      - name: code-only game flutter analyze + test
        working-directory: examples/code_only
        env:
          FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The editor (M4): its widget tests, and the ones that drive the real
      # authoring session, the Metal viewport and a Play process. Some
      # copy examples/reference_game, so they run after its checks.
      - name: editor pub get + analyze + test
        working-directory: apps/editor
        env:
          FYNKEL_CLI: ${{ github.workspace }}/target/debug/fynkel
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      # The stress scene (benchmarks/stress, M3-06): generated, locked,
      # cooked and rendered once headlessly; the draw-call ceiling of the
      # item 6 gate is checked here, the frame rate only by the capture.
      - name: stress scene generate + cook + render (draws ≤ pairs)
        run: |
          python3 benchmarks/stress/generate.py
          "$GITHUB_WORKSPACE/target/debug/fynkel" project lock --project benchmarks/stress/project
          "$GITHUB_WORKSPACE/target/debug/fynkel" cook --project benchmarks/stress/project
          "$GITHUB_WORKSPACE/target/debug/fynkel" render --project benchmarks/stress/project --no-cook --json --out "${{ runner.temp }}/stress.png" > "${{ runner.temp }}/stress.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print({k: r[k] for k in ('meshes','instances','culled','draws','batches')}); assert r['meshes'] >= 5000 and r['draws'] <= r['batches'] and r['culled'] > 0" "${{ runner.temp }}/stress.json"

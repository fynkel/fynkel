[package]
name = "fynkel_platform_macos"
description = "macOS platform interop (blueprint §8.4, ADR-0002 Path A): renders the core's extract into a ring of IOSurface-backed Metal textures that a Flutter Texture presents without a copy. Exports the fynkel_native ABI from the same dylib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fynkel_contracts.workspace = true
fynkel_core.workspace = true
fynkel_render.workspace = true
fynkel_native.workspace = true
wgpu.workspace = true
wgpu-hal = { version = "30.0.1", features = ["metal"] }
glam.workspace = true
log.workspace = true
env_logger.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-core-foundation.workspace = true
objc2-io-surface.workspace = true
block2.workspace = true

[dev-dependencies]
fynkel_scene.workspace = true

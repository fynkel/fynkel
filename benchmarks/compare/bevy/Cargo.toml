[package]
name = "cmp_bevy"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not part of the repo's root workspace.
[workspace]

[lib]
name = "cmp_bevy"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "cmp_bevy"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "scene",
    "std",
    "bevy_winit",
    "multi_threaded",
    "jpeg",
    "png",
    "bevy_sprite",
    "bevy_sprite_render",
] }

# Same wgpu as bevy_render 0.19.1 (unified); used for the Metal hal hook.
wgpu = { version = "29.0.3", default-features = false, features = ["metal"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLCommandBuffer"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

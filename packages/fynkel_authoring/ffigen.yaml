# Generates lib/src/native/fynkel_authoring_bindings.g.dart from the
# hand-written C header (ADR-0004, blueprint §19.2e item 1). Run from
# packages/fynkel_authoring:  dart run ffigen
name: FynkelAuthoringBindings
description: Generated dart:ffi bindings for crates/fynkel_native/include/fynkel_authoring.h (authoring ABI v4). Do not edit.
output: lib/src/native/fynkel_authoring_bindings.g.dart
headers:
  entry-points:
    - ../../crates/fynkel_native/include/fynkel_authoring.h
  include-directives:
    - '**fynkel_authoring.h'
    - '**fynkel.h'
# Only the authoring surface plus the two fynkel.h types it uses; the engine
# ABI proper is package:fynkel's.
functions:
  include:
    - 'fynkel_authoring_.*'
    # Live Play mode (ADR-0021 P7): a call on a running game's world.
    - 'fynkel_world_live_call'
structs:
  include:
    - FynkelBufferView
    - FynkelAuthoringSession
enums:
  include:
    - FynkelStatus
macros:
  include:
    - FYNKEL_AUTHORING_ABI_VERSION
    - FYNKEL_PREVIEW_OPEN_NO_COOK
typedefs:
  exclude:
    - '.*'
# `@Native` bindings resolved through the native-assets code asset that
# package:fynkel's hook/build.dart registers (ADR-0015) — the same library,
# built with the `authoring` feature; no DynamicLibrary.open at runtime.
ffi-native:
  asset-id: 'package:fynkel/fynkel_native'
preamble: |
  // GENERATED by ffigen from crates/fynkel_native/include/fynkel_authoring.h — do not edit.
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
silence-enum-warning: true

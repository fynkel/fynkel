name: fynkel_flutter
description: Shows a Fynkel 3D game in a Flutter app. The FynkelApp, FynkelGame and FynkelView widgets, on macOS, iOS and Android.
version: 0.1.1
homepage: https://fynkel.com
repository: https://github.com/fynkel/fynkel/tree/main/packages/fynkel_flutter
issue_tracker: https://github.com/fynkel/fynkel/issues
topics:
  - game
  - game-engine
  - graphics

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # package:fynkel_flutter/testing.dart, for a game's widget tests.
  flutter_test:
    sdk: flutter
  fynkel:
    path: ../fynkel

dev_dependencies:
  # The tests check the engine view directly.
  ffi: ^2.2.0
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.fynkel.fynkel_flutter
        pluginClass: FynkelFlutterPlugin
      # One Swift source for both (darwin/): only the imports differ.
      ios:
        pluginClass: FynkelFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FynkelFlutterPlugin
        sharedDarwinSource: true
